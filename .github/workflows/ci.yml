# Runs the two gates this project already has, on every push, so that drift is caught by a
# machine instead of by someone remembering to look.
#
# WHAT THIS CHECKS
#   run_tests.py             every assertion written, nothing more. The count is
#                            environment-dependent: two checks in
#                            models/test_predict_constrained_frequency.py run against the real
#                            V100 dataset and SKIP when data/raw/ is absent.
#   audit_claims.py          claims recomputed from the CSVs and asserted present in the documents
#                            verbatim and exactly once. A failure here means the prose and the
#                            data disagree, which is a finding, not a broken script.
#
#   NO COUNT IS WRITTEN IN THIS FILE. It carried four - 534 checks, 15 suites, 168 claims, 193 -
#   and all four were stale by 2026-09-13, in a repository whose own rules say to read counts off
#   `python run_tests.py` and `python analysis/audit_claims.py --coverage` and never off a file.
#   The canonical totals live in CLAUDE.md's coverage block, which is itself audited.
#
# WHAT THIS DOES NOT CHECK - stated here for the same reason every tool in this repo states its
# own limits in its own output:
#
#   - Nothing that needs a GPU. gpu_workload.py, the sweep harness, the stability logger and the
#     probe_* scripts are never executed here. CI cannot tell you a sweep is valid.
#   - THE "checks" JOB fetches no datasets. data/raw/ and data/external/ are gitignored, so
#     characterize.py (the 44.4% figure), curve_model.py and the models/ predictions do not run
#     there, and the two dataset-backed checks noted above skip. That the audit is green without
#     them is a fact about claim coverage, not a sign the reference results were verified.
#
#     THE "V100 reference claims" JOB fetches both. claims_reference.py audits the V100 set - the
#     44.4% gap, the null, the constrained inversion - and since 2026-09-13 claims_datasets.py
#     audits the published CONSUMER sets under data/external/ for section 2.7. ⛔ That second
#     fetch did not exist until section 2.7 had produced two retractions in a single day, neither
#     of which any CI leg could have caught, because nothing here had ever read those files.
#     The licensing note in scripts/Get-Dataset.ps1 governs both fetches.
#
#     One consequence is easy to trip over and did, on 2026-09-02: any claim whose value depends
#     on the SIZE of the registry is environment-dependent, because a block of claims registers
#     only where the fetched data is present. header-pinned-count is guarded for exactly that
#     reason - and since 2026-09-13 that guard requires BOTH fetched sets, so an environment with
#     one and not the other pins neither total rather than pinning a misleading one.
#   - Green means every claim that EXISTS passes, not that the paper is covered. The coverage step
#     below prints the sections with no claims; it is informational and never fails the build.
#   - The audit pins numbers, not assertions. A heading or a sentence can state a mechanism the
#     data has refuted and still pass, because no number in it is wrong.
#
# No paths filter, deliberately: a data README can carry pinned claims (two currently do), so
# there is no file in this repo whose edit is guaranteed not to move the audit.

name: CI

on:
  push:
  pull_request:
  # Lets a run be started from the Actions tab without inventing a commit. Useful mainly for the
  # reference job below: it is the one that depends on an upstream repository, so re-running it
  # unchanged is a real diagnostic - a red that goes green on retry was the network, a red that
  # stays red is the dataset having moved.
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run on the same ref. Keeps minutes down on a private repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests + claims audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs always run. One platform failing is a result worth seeing next to the other,
      # not a reason to hide it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Five tracked paths run to 126-129 characters. The runner checks out to a short root so
      # they fit, but core.longpaths costs one line and removes the failure mode entirely - and
      # that failure is a silent one: the clone reports success, the checkout is short several
      # files, run_tests.py still passes, and only the audit notices.
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      # 3.12 is the documented floor and 3.12.10 is what the results were produced on.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Tests
        run: python run_tests.py

      - name: Claims audit
        run: python analysis/audit_claims.py

      # Never a gate. It reports which numbered sections carry no claims and which numbers inside
      # audited sections nothing pins, so the coverage gap stays visible in every run's log
      # instead of being assumed closed by a green tick above it.
      - name: Claims coverage (informational)
        run: python analysis/audit_claims.py --coverage

  # The half the job above cannot reach. claims_reference.py needs the public V100 set, which is
  # gitignored and fetched rather than committed, so the checks job skips section 5.1 entirely.
  # This job fetches it and audits it.
  #
  # It is deliberately a SEPARATE job rather than a fetch step bolted onto the one above. Both
  # gate, but the Actions page then shows two named results: a red here beside a green there says
  # the upstream dataset moved, not that the repo broke. That distinction is the whole point -
  # this job is the only one that depends on something outside this repository.
  #
  # Runs on Windows PowerShell 5.1, which is the interpreter HANDOFF.md documents and the one the
  # script was written against, so this also checks that the documented onboarding step still
  # works rather than only that the data still exists.
  reference:
    name: V100 reference claims
    runs-on: windows-latest

    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # -Only v100 fetches the three CSVs of data/raw (about 16 KB). The consumer sets and the
      # specs database under data/external are fetched too, because claims_datasets.py audits
      # section 2.7 against them. ⛔ THIS STEP PULLED ONLY v100 UNTIL 2026-09-13, on a comment
      # reading "not needed by any claim" - true at the time, and the reason section 2.7 produced
      # two retractions in one day without any CI leg being able to notice.
      #
      # Nothing is cached: these datasets state no license, which under default copyright means
      # all rights reserved, so they are fetched transiently and never stored on CI.
      - name: Fetch the public V100 dataset
        shell: powershell
        run: .\scripts\Get-Dataset.ps1 -Only v100

      - name: Fetch the published consumer sets and the specs database
        shell: powershell
        run: |
          .\scripts\Get-Dataset.ps1 -Only gtx1080ti
          .\scripts\Get-Dataset.ps1 -Only gpuspecs

      # LOAD-BEARING, do not fold into the step above. Get-Dataset.ps1 catches a failed download,
      # prints FAIL, and still exits 0 - so a fetch that silently returned nothing would leave
      # claims_reference.py registering nothing, the audit reporting 121 of 121, and this job
      # green while having checked exactly none of what it exists to check.
      #
      # audit_claims.py exits 1 when a --filter matches no claims. Filtering on one exact claim id
      # therefore proves the dataset arrived AND the module registered against it. Do not shorten
      # this to --filter 5.1- : that substring also matches every 5.5.1-* claim, which register
      # with or without the dataset, and the guard would pass while proving nothing.
      - name: Verify the fetch actually landed
        run: python analysis/audit_claims.py --filter 5.1-workload-count

      # Same contract as the step above, for the second fetch. claims_datasets.py skips silently
      # when data/external is missing, so without this a failed consumer download would leave
      # section 2.7 unchecked and this job green - and the totals in the coverage block would
      # disagree with what this leg actually ran.
      - name: Verify the consumer fetch actually landed
        run: python analysis/audit_claims.py --filter 2.7-declared-defaults-are-grid-points

      - name: Full audit, reference data included
        run: python analysis/audit_claims.py
